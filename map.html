<style>
#pgload{position:fixed;inset:0;z-index:9999;background:#f7f9fb;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;transition:opacity .22s}
#pgload.done{opacity:0;pointer-events:none}
#pgload .sp{width:34px;height:34px;border:3px solid #d5dfe8;border-top-color:#1b4f8a;border-radius:50%;animation:pgsp .7s linear infinite}
#pgload small{color:#77828d;font-size:12px}
@keyframes pgsp{to{transform:rotate(360deg)}}
a:active,.chip:active,.card:active,.city-tab:active,.navlinks a:active{transform:scale(.97)}
</style>
<style>
:root{
  --bg:#f7f9fb; --panel:#ffffff; --ink:#22282e; --muted:#77828d;
  --accent:#1b4f8a; --accent2:#0e7c6b; --line:#dfe6ec;
  --chip:#eef3f7; --winter:#0f7bbd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
html,body{overscroll-behavior:none}
.topnav{position:relative;z-index:1200;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:58px;padding:9px clamp(14px,3vw,28px);background:rgba(247,249,251,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{display:flex;flex-direction:column;min-width:0}
.brand strong{font-size:15px;line-height:1.25}
.brand span{color:var(--muted);font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navlinks{display:flex;align-items:center;gap:8px;flex-shrink:0}
.navlinks a{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:var(--panel);text-decoration:none;font-size:14px;font-weight:700}
.navlinks a[aria-current="page"]{color:#fff;background:var(--accent2);border-color:var(--accent2)}
#app{display:flex;flex:1;min-height:0;height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow:hidden}

/* 桌機不是「大地圖＋小清單」，而是日期導航／流程清單／地圖三欄工作區。 */
#sidebar{width:clamp(660px,58vw,820px);min-width:660px;display:flex;background:var(--panel);border-right:1px solid var(--line);z-index:1000}
#desktopRail{width:220px;flex:0 0 220px;display:flex;flex-direction:column;padding:16px 12px;background:#f4f7fa;border-right:1px solid var(--line);overflow:hidden}
.desktop-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.desktop-mode button{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:700 13px inherit;cursor:pointer}
.desktop-mode button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.rail-title{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;margin:2px 4px 8px;text-transform:uppercase}
#desktopDayList,#desktopRegionList{min-height:0;overflow-y:auto;padding-right:3px}
.desktop-day,.desktop-region{width:100%;display:block;text-align:left;border:1px solid transparent;border-radius:11px;background:transparent;padding:9px 10px;margin:0 0 5px;cursor:pointer;color:var(--ink);font-family:inherit}
.desktop-day:hover,.desktop-region:hover{background:#fff;border-color:var(--line)}
.desktop-day.active,.desktop-region.active{background:#fff;border-color:#9eb8d4;box-shadow:0 2px 8px rgba(27,79,138,.10)}
.desktop-day strong,.desktop-region strong{display:block;font-size:13px;line-height:1.3}
.desktop-day span,.desktop-region span{display:block;margin-top:3px;font-size:10.5px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desktop-day.active strong,.desktop-region.active strong{color:var(--accent)}
.rail-foot{margin-top:auto;padding:10px 6px 2px;color:var(--muted);font-size:10.5px;line-height:1.5}
#sidebarMain{min-width:0;flex:1;display:flex;flex-direction:column;background:#fff}
.sheet-handle{display:none}
header{padding:14px 18px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;letter-spacing:.5px}
header p{font-size:12px;color:var(--muted);margin-top:3px}
.city-tabs{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.city-tab{flex:1;min-width:70px;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;background:var(--chip);transition:.15s;white-space:nowrap}
.city-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-toggle{display:flex;align-items:center;justify-content:center;width:calc(100% - 28px);margin:8px 14px 0;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--chip);color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
#offlineBtn{display:block;width:calc(100% - 28px);margin:6px 14px 0;padding:8px 10px;border:1px solid #cfe3de;border-radius:9px;background:#eef6f4;color:var(--accent2);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
#offlineBtn:active{transform:scale(.97)}
#offlineBtn:disabled{opacity:.6;cursor:default}
.filters.collapsed{display:none}
.filters{padding:10px 14px;border-bottom:1px solid var(--line);transition:opacity .2s}
.filter-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{padding:5px 10px;border-radius:20px;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:#fff;user-select:none;transition:.12s}
.chip.on{color:#fff;border-color:transparent}
.chip.winter-chip.on{background:var(--winter)}
.chip.cuisine-chip.on{background:var(--accent2);color:#fff;border-color:transparent}
#cuisineChips{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
#cuisineChips.hidden{display:none}
.search-wrap{position:relative}
#search{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none}
#search:focus{border-color:var(--accent)}
.search-clear{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:24px;height:24px;display:none;align-items:center;justify-content:center;padding:0;border:0;border-radius:50%;background:var(--chip);color:var(--muted);font-size:12px;line-height:1;cursor:pointer}
.search-wrap.has-text .search-clear{display:flex}
#count{font-size:12px;color:var(--muted);padding:8px 18px 4px}
#tripSummary{display:none;margin:10px 14px 4px;padding:12px 14px;border:1px solid #cfdae5;border-radius:13px;background:linear-gradient(135deg,#f3f7fb,#fff)}
#tripSummary h2{font-size:16px;line-height:1.35;color:var(--accent)}
#tripSummary p{font-size:12px;line-height:1.5;color:#51606d;margin-top:4px}
.summary-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.summary-badges span{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:12px;background:#e7eef5;color:#365775}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 20px;overscroll-behavior:contain}
.trip-controls{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 8px rgba(0,0,0,.06)}
.card{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 4px;cursor:pointer;background:#fff;transition:.12s}
.card:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card .top{display:flex;align-items:center;gap:7px}
.badge{font-size:10.5px;color:#fff;padding:2px 7px;border-radius:9px;white-space:nowrap}
.winter-tag{font-size:10.5px;color:var(--winter);border:1px solid var(--winter);padding:1px 6px;border-radius:9px;white-space:nowrap}
.halal-tag{font-size:10.5px;color:#0e7c3f;border:1px solid #0e7c3f;padding:1px 6px;border-radius:9px;white-space:nowrap}
.halal-tag.friendly{color:#3f8f4e;border-color:#7cc98a}
.halal-tag.pray{color:#6d28d9;border-color:#a78bfa}
.tabelog-tag{font-size:10.5px;color:#b45309;border:1px solid #e8b287;background:#fff8ef;padding:1px 6px;border-radius:9px;white-space:nowrap;font-weight:700}
.chip.halal-chip.on{background:#0e7c3f}
.card h3{font-size:14.5px;flex:1}
.card .ja{font-size:11px;color:var(--muted);margin-top:2px}
.card .meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
.card .dishes{font-size:12px;margin-top:5px;color:#4d555d}
.trip-card{position:relative;margin-left:16px;padding:13px 14px 12px 16px;overflow:visible}
.trip-card::before{content:'';position:absolute;left:-15px;top:-10px;bottom:-11px;width:2px;background:#d8e2eb}
.trip-card.first::before{top:24px}
.trip-card.last::before{bottom:calc(100% - 26px)}
.trip-card .badge{position:absolute;left:-27px;top:15px;width:26px;height:26px;padding:0;border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;box-shadow:0 1px 5px rgba(0,0,0,.18)}
.trip-card .top{padding-left:0;align-items:flex-start}
.trip-card h3{font-size:15px;line-height:1.35}
.trip-time{flex:0 0 48px;color:var(--accent);font-size:13px;font-weight:900;line-height:1.4}
.trip-label{font-size:11px;color:var(--muted);margin-top:2px}
.trip-brief{font-size:12px;line-height:1.55;color:#43505b;margin-top:8px}
.trip-details{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px}
.trip-details summary{cursor:pointer;color:var(--accent);font-size:11.5px;font-weight:800;user-select:none}
.trip-details .trip-full{font-size:12px;line-height:1.6;color:#4d555d;margin-top:7px}
.trip-leg{margin:10px -14px -12px -16px;padding:8px 13px 9px 16px;border-radius:0 0 11px 11px;background:#f1f5f8;color:#41617f;font-size:11.5px;line-height:1.45}
.mobile-trip-full{display:none}

body.mode-trip #tripSummary{display:block}
body.mode-trip #sidebarMain>header,body.mode-trip #sidebarMain>.city-tabs,body.mode-trip #filterToggle,body.mode-trip #filters,body.mode-trip #offlineBtn{display:none}
body.mode-trip #count{padding-top:7px;text-align:right}
body.mode-trip #list{padding-top:0}
body.mode-trip .trip-controls .day-chip{display:none}
body.mode-place #tripSummary{display:none}
body.mode-place #sidebarMain>header,body.mode-place #sidebarMain>.city-tabs,body.mode-place #offlineBtn{display:none}
body.mode-place #filterToggle{margin-top:10px}
body.mode-place .card{padding:9px 11px;margin:6px 4px}
body.mode-place .card .dishes{display:none}

#map{flex:1;height:100%}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.35);transition:transform .12s ease,box-shadow .12s ease}
.pin span{transform:rotate(45deg);font-size:14px;line-height:1}
.pin-wrap.pin-hl{z-index:1200 !important}
.pin-wrap.pin-hl .pin{transform:rotate(-45deg) scale(1.5);box-shadow:0 0 0 4px rgba(14,124,107,.45),0 5px 14px rgba(0,0,0,.5)}
.card.active{border-color:var(--accent2);box-shadow:0 3px 12px rgba(14,124,107,.18)}
.leaflet-popup-content-wrapper{border-radius:12px}
.leaflet-popup-content{margin:14px 16px;min-width:230px;max-width:300px}
.pp h3{font-size:16px;margin-bottom:2px}
.pp .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.pp .row{font-size:12.5px;line-height:1.65;margin-top:6px}
.pp .row b{color:var(--accent2)}
.pp .warn b{color:#b7791f}
.pp .coordwarn{font-size:11px;color:#9a7415;background:#fff8e6;border-radius:7px;padding:3px 7px;margin-top:7px}
.pp .dish-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pp .dish-chips span{background:var(--chip);border-radius:8px;padding:2px 8px;font-size:11.5px}

.loc-btn{width:34px;height:34px;line-height:32px;text-align:center;font-size:17px;background:#fff;border:2px solid rgba(0,0,0,.2);border-radius:4px;cursor:pointer;user-select:none}
.loc-btn.active{background:#0e7c6b;color:#fff}
.loc-btn.err{background:#c0392b;color:#fff}
.me-dot{width:16px;height:16px;border-radius:50%;background:#1976d2;border:3px solid #fff;box-shadow:0 0 0 2px rgba(25,118,210,.35);position:relative}
.me-dot::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(25,118,210,.45);animation:mepulse 1.6s ease-out infinite}
@keyframes mepulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.4);opacity:0}}
.legend{position:absolute;bottom:18px;right:12px;z-index:900;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;line-height:1.9}

#mobileToolbar,#mobileDetail,#mobileDayBar{display:none}

@media (min-width:761px) and (max-width:1080px){
  #sidebar{width:620px;min-width:620px}
  #desktopRail{width:190px;flex-basis:190px}
}

@media (max-width:760px){
  .topnav{min-height:44px;padding:4px 12px}
  .brand strong{font-size:13.5px}
  .brand .trip-date{display:none}
  .brand .site-meta{display:block;font-size:9.5px}
  .navlinks{gap:5px}
  .navlinks a{min-height:32px;padding:0 8px;font-size:12px;border-radius:7px}
  #app{height:calc(100vh - 44px);height:calc(100dvh - 44px);position:relative;display:block}
  #map{position:absolute;inset:0;height:100%}
  #sidebar{position:absolute;left:0;right:0;bottom:0;width:100%;min-width:0;height:min(88%,calc(100dvh - 52px));display:flex;flex-direction:column;
    border-right:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:1001;
    box-shadow:0 -4px 18px rgba(0,0,0,.16);flex:none;background:rgba(255,255,255,.98);
    transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.7,.3,1);will-change:transform;padding-bottom:78px}
  #desktopRail{display:none}
  #sidebarMain{display:flex;flex-direction:column;flex:1;min-height:0}
  body.mui-list #sidebar{transform:translateY(12%)}
  body.mui-filter #sidebar{transform:translateY(6%)}
  body.mui-map #sidebar{transform:translateY(105%)}
  #sidebar.dragging{transition:none}
  .sheet-handle{display:flex;justify-content:center;align-items:center;padding:10px 0 7px;cursor:pointer;touch-action:none;flex-shrink:0}
  .sheet-handle span{width:44px;height:5px;border-radius:3px;background:#d5dde4}
  header{padding:0 14px 6px}
  header h1{font-size:15.5px}
  header p{font-size:11px}
  .city-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .city-tabs::-webkit-scrollbar{display:none}
  .city-tab{padding:8px 10px;font-size:13px;flex:0 0 auto;min-width:64px}
  .filter-toggle{display:none}
  body.mui-list .filters,body.mui-list #count{display:none}
  body.mui-filter .filters,body.mui-filter .filters.collapsed{display:block}
  body.mui-filter #list,body.mui-filter #count,body.mui-filter #offlineBtn{display:none}
  body.mui-filter header p::after{content:'｜設定完按下方「地圖」回去'}
  .filters{border-bottom:0;padding:10px 14px 18px;overflow-y:auto}
  .filter-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:5px;margin-bottom:10px}
  .filter-row::-webkit-scrollbar{display:none}
  .chip{padding:8px 13px;font-size:13px;flex:0 0 auto;white-space:nowrap}
  #search{font-size:16px;padding:11px 34px 11px 12px}
  #list{padding:4px 12px 96px}
  #offlineBtn{margin-bottom:8px}
  .card{padding:12px 14px}
  .card h3{font-size:15px}
  body.mode-trip #sidebarMain>header,body.mode-trip #sidebarMain>.city-tabs{display:block}
  body.mode-trip #filters,body.mode-trip #count{display:none}
  body.mode-trip #offlineBtn{display:block}
  body.mode-trip #tripSummary{display:none}
  body.mode-trip .trip-controls .day-chip{display:inline-flex}
  body.mode-place #sidebarMain>header,body.mode-place #sidebarMain>.city-tabs,body.mode-place #offlineBtn{display:block}
  body.mode-place #filterToggle{margin-top:8px}
  body.mode-place .card{padding:12px 14px;margin:8px 4px}
  body.mode-place .card .dishes{display:block}
  .trip-card{margin-left:4px;padding:12px 14px}

  .trip-card .badge{position:static;width:auto;height:auto;padding:2px 7px;border:0;border-radius:9px;box-shadow:none}
  .trip-time{display:none}
  .trip-brief,.trip-details{display:none}
  .mobile-trip-full{display:block;font-size:12px;margin-top:5px;color:#4d555d}

  .leaflet-popup{display:none}
  #mobileToolbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:1102;
    display:grid;grid-template-columns:1.4fr .95fr .95fr 44px;gap:7px;align-items:center;padding:8px;
    background:rgba(255,255,255,.96);border:1px solid rgba(223,230,236,.95);border-radius:17px;box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(12px)}
  #mobileToolbar button{height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:700 12.5px inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body>
<div id="pgload"><div class="sp"></div><small>地圖載入中…</small></div>
<nav class="topnav" aria-label="主要導覽">
  <div class="brand">
    <strong>Fukuoka Trip</strong>
    <span class="site-meta" id="siteMeta">2027/2/1–2/12</span>
  </div>
  <div class="navlinks">
    <a href="prep.html">行前</a>
    <a href="itinerary.html">行程</a>
    <a href="map.html" aria-current="page">地圖</a>
  </div>
</nav>
<div id="app">
  <div id="sidebar">
    <aside id="desktopRail" aria-label="桌機版地圖導覽">
      <div class="desktop-mode">
        <button type="button" id="desktopModeTrip" class="active">📅 行程</button>
        <button type="button" id="desktopModePlace">📍 地點庫</button>
      </div>
      <div id="desktopTripNav">
        <div class="rail-title">每日行程</div>
        <div id="desktopDayList"></div>
      </div>
      <div id="desktopPlaceNav" hidden>
        <div class="rail-title">區域</div>

<script>
// 分類設定：顏色＋圖示
const CATS={
  "景點":{color:"#1b4f8a",emoji:"🏯",label:"景點"},
  "祭典":{color:"#c0392b",emoji:"🏮",label:"祭典活動"},
  "動漫":{color:"#0891b2",emoji:"🎀",label:"動漫・三麗鷗・寶可夢"},
  "溫泉":{color:"#d81b60",emoji:"♨️",label:"溫泉"},
  "購物":{color:"#a78bfa",emoji:"🛍",label:"購物"},
  "餐飲":{color:"#e67e22",emoji:"🍽",label:"餐飲"},
  "住宿":{color:"#37474f",emoji:"🏨",label:"住宿"},
  "交通":{color:"#5d4037",emoji:"🚄",label:"車站機場"}
};
// 清真標記用色（要宣告在 legend 之前，否則 const 的 TDZ 會讓整頁掛掉）
const HALAL_COLOR="#0e7c3f",HALAL_FRIENDLY_COLOR="#3f8f4e",PRAY_COLOR="#6d28d9";
const FOOD_CATS=new Set(["餐飲"]);
// 區域頁籤：把 city 收成 5 個地理群組，不然頁籤會太多
const REGIONS=[
  {key:"福岡",   label:"福岡",        cities:["福岡"],                          center:[33.5902,130.4185], zoom:11},
  {key:"長崎",   label:"長崎",        cities:["長崎"],                          center:[32.7450,129.8730], zoom:13},
  {key:"大分",   label:"由布院・大分", cities:["大分"],                          center:[33.2900,131.4100], zoom:11},
  {key:"北九州", label:"門司・下關",   cities:["北九州"],                        center:[33.9450,130.9500], zoom:12},
  {key:"其他",   label:"其他",        cities:["熊本","佐賀","鹿兒島","其他"],   center:[33.0000,130.8000], zoom:8}
];

// 日文新字體 → 繁體：搜尋兩邊都正規化，輸入「天滿宮」找得到「天満宮」
const _J2T=(typeof J2T!=="undefined")?J2T:{};
function j2t(s){let r="";for(const c of s)r+=_J2T[c]||c;return r;}
// 顯示名：有 name_zh 就用中文當標題，原文降為副標；
// 沒有 name_zh 時維持原行為，但若 name 與 name_ja 相同則不重複顯示。
function zhName(p){return p.name_zh||p.name;}
function jaName(p){const ja=p.name_ja||p.name;return ja&&ja!==zhName(p)?ja:"";}

const map=L.map('map',{zoomControl:true}).setView(REGIONS[0].center,REGIONS[0].zoom);
// 國土地理院圖磚：官方、免金鑰、日本境內細節最好；座標為 WGS-84，與資料一致（無中國那種偏移問題）
const GSI_PALE='https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png';
const baseGSI=L.tileLayer(GSI_PALE,{maxZoom:18,attribution:'&copy; <a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a>'}).addTo(map);
const baseGSIStd=L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; 国土地理院'});
const baseOSM=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
const BASES={"國土地理院 淡色":baseGSI,"國土地理院 標準":baseGSIStd,"OpenStreetMap":baseOSM};
const layerCtl=L.control.layers(BASES,null,{position:'topright'}).addTo(map);

// ---------- Google Map 底圖（選用）----------
// 走官方路線：載入 Google Maps JavaScript API，再用 GoogleMutant 把它包成 Leaflet 圖層，
// 所有既有的圖釘／popup／路線程式碼都不用改。
// 沒填金鑰就完全不載入 Google 的東西，網站照常運作（預設國土地理院）。
// ⚠️ 不使用 mt0.google.com 之類的裸圖磚網址——那違反 Google 服務條款。
const GOOGLE_LAYER_NAMES=["Google 道路","Google 衛星","Google 地形"];
window.__googleBaseActive=false;
(function initGoogleBase(){
  const key=(typeof GMAPS_KEY!=="undefined")?String(GMAPS_KEY).trim():"";
  if(!key)return;                      // 沒金鑰就跳過，維持國土地理院
  const cb="__gmapsReady";
  let gLayers=null, googleOK=false, googleFailed=false, guard=null;

  function notice(msg){
    let el=document.getElementById('mapNotice');
    if(!el){
      el=document.createElement('div'); el.id='mapNotice';
      el.style.cssText='position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:1100;'
        +'max-width:min(560px,92%);background:#fff8e6;border:1px solid #e0c878;color:#6b5a1e;'
        +'border-radius:10px;padding:9px 34px 9px 12px;font-size:12.5px;line-height:1.7;'
        +'box-shadow:0 3px 12px rgba(0,0,0,.15)';
      const x=document.createElement('button');
      x.textContent='✕';
      x.style.cssText='position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;color:#8a7a3e;font-size:13px';
      x.onclick=function(){el.remove();};
      el.appendChild(x);
      const t=document.createElement('span'); t.id='mapNoticeText'; el.insertBefore(t,x);
      document.getElementById('map').appendChild(el);
    }
    document.getElementById('mapNoticeText').innerHTML=msg;
  }

  // 退回國土地理院。⚠️ 這支必須是冪等的：gm_authFailure 可能被呼叫多次。
  // hard=true（認證失敗）才把 Google 選項從圖層選單移除；
  // 只是逾時的話保留選項，讓使用者網路好的時候可以自己再切一次。
  function fallbackToGSI(reason,hard){
    if(googleFailed)return;
    googleFailed=true;
    if(guard){clearInterval(guard);guard=null;}
    if(gLayers){
      Object.values(gLayers).forEach(function(l){
        if(map.hasLayer(l))map.removeLayer(l);
        if(hard)layerCtl.removeLayer(l);
      });
      if(hard)gLayers=null;
    }
    if(!map.hasLayer(baseGSI))map.addLayer(baseGSI);
    window.__googleBaseActive=false;
    syncOfflineBtn();
    console.warn('Google 底圖不可用（'+reason+'），已切回國土地理院。');
    notice('<b>Google 底圖無法使用</b>（'+reason+'），已自動切回<b>國土地理院</b>底圖——地圖與所有圖釘都正常。'
      +'<br>要修：Google Cloud Console → 該金鑰所屬專案 → 啟用「Maps JavaScript API」並確認已設定計費。');
  }

  // Google 官方的認證失敗回呼：金鑰無效、API 未啟用、未設定計費、參照網址被擋，都走這裡。
  // 這是唯一可靠的失敗訊號——script 的 onerror 不會觸發，callback 也照常執行。
  window.gm_authFailure=function(){ fallbackToGSI('API 未啟用或金鑰受限',true); };

  window[cb]=function(){
    try{
      // GoogleMutant 0.13.4 內部是 `styles: this.options.styles || {}`，
      // 沒給就傳空物件，但 Google 要求陣列 → 主控台會噴 "Map styles must be an array"。
      // 明確傳 [] 繞掉這個上游 bug。
      const base={styles:[]};
      gLayers={
        "Google 道路":L.gridLayer.googleMutant(Object.assign({},base,{type:"roadmap"})),
        "Google 衛星":L.gridLayer.googleMutant(Object.assign({},base,{type:"hybrid"})),
        "Google 地形":L.gridLayer.googleMutant(Object.assign({},base,{type:"terrain"}))
      };
      Object.entries(gLayers).forEach(function(e){layerCtl.addBaseLayer(e[1],e[0]);});

      // ⚠️ 關鍵：先把 Google 疊在國土地理院「之上」，確認沒有認證錯誤才移除底下那層。
      // 之前的寫法是 callback 一觸發就 removeLayer(baseGSI)，但 script 載入成功 ≠ API 可用；
      // ApiNotActivatedMapError 是 render 時才報，那時 GSI 已經被移掉 → 整張圖空白（實際踩過）。
      map.addLayer(gLayers["Google 道路"]);
      // 輪詢確認，不能只靠 gm_authFailure——那支回呼不保證會被呼叫。
      // ⚠️ 也<b>不能</b>用「有沒有 &lt;img&gt; 圖磚」判斷：新版 Maps JS（v3.65+）
      // 走向量／WebGL 渲染時根本不產生 img 元素，會被誤判成失敗（實際踩過）。
      // 正確的成功訊號是 Google 建好地圖容器 .gm-style；失敗訊號是 .gm-err-container。
      var waited=0, POLL=400, MAXW=12000;
      guard=setInterval(function(){
        if(googleFailed){clearInterval(guard);guard=null;return;}
        // ⚠️ 頁面在背景（visibilityState==='hidden'）時 Google Maps 不會初始化，
        // 這時不能累計逾時——否則使用者在背景分頁開啟連結，就會被誤判成
        // 「Google 逾時」而白白退回國土地理院（實測踩到）。等回到前景再算。
        if(document.visibilityState==='hidden')return;
        waited+=POLL;
        if(document.querySelector('.gm-err-container,.gm-err-content')){
          clearInterval(guard);guard=null;
          fallbackToGSI('API 未啟用或金鑰受限',true); return;
        }
        if(document.querySelector('.gm-style')){
          clearInterval(guard);guard=null;
          googleOK=true;
          map.removeLayer(baseGSI);        // 確定 Google 容器建好了，才拆掉墊底層
          window.__googleBaseActive=true;
          syncOfflineBtn();
          return;
        }
        if(waited>=MAXW){
          clearInterval(guard);guard=null;
          fallbackToGSI('Google 地圖逾時未初始化',false);
        }
      },POLL);
    }catch(e){ fallbackToGSI('初始化例外：'+e.message,true); }
  };

  const sc=document.createElement("script");
  sc.async=true;
  sc.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(key)+"&callback="+cb+"&v=weekly&loading=async";
  sc.onerror=function(){ fallbackToGSI('Google Maps API 載入失敗',true); };
  document.head.appendChild(sc);
})();
// 切到 Google 底圖時停用離線預載（Google 圖磚不得快取）
function syncOfflineBtn(){
  const b=document.getElementById('offlineBtn');
  if(!b)return;
  if(window.__googleBaseActive){
    if(!b.dataset.origText)b.dataset.origText=b.textContent;   // 先存原文再覆蓋
    b.disabled=true; b.textContent='⬇️ Google 底圖不可離線快取（切到國土地理院即可預載）';
  }else if(b.dataset.origText){
    b.disabled=false; b.textContent=b.dataset.origText;
  }
}
map.on('baselayerchange',function(e){
  var _n=document.getElementById('mapNotice'); if(_n)_n.remove();   // 使用者手動切底圖＝已接手，提示收掉
  window.__googleBaseActive=GOOGLE_LAYER_NAMES.includes(e.name);
  syncOfflineBtn();
});

// 建立分類 chips
const catChips=document.getElementById('catChips');
const cuisineChipsBox=document.getElementById('cuisineChips');
Object.entries(CATS).forEach(([k,v])=>{
  if(FOOD_CATS.has(k))return;
  const c=document.createElement('span');c.className='chip on';c.dataset.cat=k;
  c.textContent=v.emoji+" "+v.label;
  c.style.background=v.color;c.style.color="#fff";
  c.onclick=()=>{
    c.classList.toggle('on');
    if(c.classList.contains('on')){state.cats.add(k);c.style.background=v.color;c.style.color="#fff";}
    else{state.cats.delete(k);c.style.background="#fff";c.style.color="var(--ink)";}
    rerender();
  };
  catChips.appendChild(c);
});
const FOOD_MERGED=CATS["餐飲"];
const foodChip=document.createElement('span');
foodChip.className='chip on';foodChip.id='foodChip';
foodChip.textContent=FOOD_MERGED.emoji+" "+FOOD_MERGED.label;
foodChip.style.background=FOOD_MERGED.color;foodChip.style.color="#fff";
foodChip.onclick=()=>{
  foodChip.classList.toggle('on');
  const on=foodChip.classList.contains('on');
  if(on){FOOD_CATS.forEach(k=>state.cats.add(k));foodChip.style.background=FOOD_MERGED.color;foodChip.style.color="#fff";}
  else{FOOD_CATS.forEach(k=>state.cats.delete(k));foodChip.style.background="#fff";foodChip.style.color="var(--ink)";}
  cuisineChipsBox.classList.toggle('hidden',!on);
  rerender();
};
catChips.appendChild(foodChip);
// 餐飲子分類：原始 cuisine 有 32 種，全部攤成 chips 會吃掉整個版面。
// 收成 7 個語意群組，一列就放得完；清真獨立成群，方便一眼找到。
const CUISINE_GROUPS=[
  ["☪ 清真",      c=>c.startsWith("清真")],
  ["🍲 鄉土・和食", c=>["鄉土料理","和食","定食・明太子","馬肉","壽喜燒","肉包"].includes(c)],
  ["🐟 海鮮・壽司", c=>["海鮮","壽司","牡蠣・海鮮","海鮮・居酒屋","鰻魚"].includes(c)],
  ["🥩 肉・燒肉",   c=>["燒肉","燒鳥","牛料理・燒肉","肉料理","串炸"].includes(c)],
  ["🍜 麵食",      c=>["拉麵","麵食","烏龍麵","うどん・そば"].includes(c)],
  ["🍰 洋食・甜點", c=>["洋食","甜點・咖啡"].includes(c)],
  ["🏮 居酒屋・其他",c=>true]
];
function cuisineGroup(c){
  const k=c||"";
  for(const [name,test] of CUISINE_GROUPS){ if(test(k)) return name; }
  return "🏮 居酒屋・其他";
}
// 把 cuisine → group 的對照表先算好，rerender 時不用重跑判斷
const CUISINE2GROUP={};
PLACES.forEach(p=>{ if(FOOD_CATS.has(p.category)&&p.cuisine&&!(p.cuisine in CUISINE2GROUP)) CUISINE2GROUP[p.cuisine]=cuisineGroup(p.cuisine); });
const GROUP_COUNTS=(function(){
  const c={};
  PLACES.forEach(p=>{ if(FOOD_CATS.has(p.category)) c[cuisineGroup(p.cuisine)]=(c[cuisineGroup(p.cuisine)]||0)+1; });
  return c;
})();
CUISINE_GROUPS.forEach(([g])=>{
  const n=GROUP_COUNTS[g]||0;
  if(!n)return;
  const c=document.createElement('span');c.className='chip cuisine-chip on';c.dataset.group=g;
  c.textContent=`${g} (${n})`;
  c.onclick=()=>{
    c.classList.toggle('on');
    if(c.classList.contains('on'))state.cuisineGroups.add(g);else state.cuisineGroups.delete(g);
    rerender();
  };
  cuisineChipsBox.appendChild(c);
});
cuisineChipsBox.classList.toggle('hidden',!foodChip.classList.contains('on'));
document.getElementById('legend').innerHTML=
  Object.entries(CATS).map(([k,v])=>`<div>${v.emoji} ${v.label}</div>`).join("")+
  `<div style="color:var(--winter)">❄️ 冬季限定／2 月亮點</div>`+`<div style="color:${HALAL_COLOR}">☪ 清真</div><div style="color:${HALAL_FRIENDLY_COLOR}">☪ 清真友善</div><div style="color:${PRAY_COLOR}">🕌 禮拜所</div>`;

// 區域頁籤
const cityTabs=document.getElementById('cityTabs');
cityTabs.innerHTML=REGIONS.map((r,i)=>`<div class="city-tab${i===0?' active':''}" data-region="${r.key}">${r.label}</div>`).join("")
  +`<div class="city-tab" data-region="__trip">📅 行程</div>`;

function _sheetPx(){return currentSheetObstruction();}
function fitPad(){return {paddingTopLeft:[40,40],paddingBottomRight:[40,40+_sheetPx()]};}
function focusOn(latlng,zoom){
  map.setView(latlng,zoom,{animate:false});
  const s=_sheetPx();
  if(s>0)map.panBy([0,Math.round(s/2)],{animate:false});
}

let state={region:"__trip",cats:new Set(Object.keys(CATS)),cuisineGroups:new Set(CUISINE_GROUPS.map(g=>g[0])),q:"",tripDay:1,tripPlan:"A",tripShowAll:false};
let markers=[],routeLine=null;
const MOBILE_MQ=window.matchMedia('(max-width:760px)');
let mobileMode='map';
function isMobileUX(){return MOBILE_MQ.matches;}
function _filterDelta(){
  let n=0;
  if(state.cats.size!==Object.keys(CATS).length)n++;
  if(state.cats.has('餐飲')&&state.cuisineGroups.size!==CUISINE_GROUPS.length)n++;
  if(state.q)n++;
  return n;
}
function syncMobileHud(){
  document.body.classList.toggle('trip-ui',isMobileUX()&&state.region==='__trip');
  const st=document.getElementById('mobileStatus');
  const ct=document.getElementById('count');
  if(st&&ct)st.textContent=ct.textContent.replace(/^顯示 /,'').replace(/（/,'｜').replace(/）/,'').slice(0,24);
  const b=document.getElementById('mobileFilterBadge');
  if(b){const n=_filterDelta();b.textContent=n?String(n):'';}
  [['mobileModeMap','map'],['mobileModeFilter','filter'],['mobileModeList','list']].forEach(([id,m])=>{
    const el=document.getElementById(id); if(el)el.classList.toggle('active',mobileMode===m);
  });
}
function setMobileMode(m){
  mobileMode=m||'map';
  document.body.classList.toggle('mui-map',isMobileUX()&&mobileMode==='map');
  document.body.classList.toggle('mui-filter',isMobileUX()&&mobileMode==='filter');
  document.body.classList.toggle('mui-list',isMobileUX()&&mobileMode==='list');
  if(mobileMode!=='map')hideMobileDetail();
  syncMobileHud();
  setTimeout(()=>{try{map.invalidateSize();}catch(e){}},260);
}
function mobileMaximize(){hideMobileDetail();map.closePopup();setMobileMode('map');}
function hideMobileDetail(){const d=document.getElementById('mobileDetail');if(d)d.hidden=true;}
function showMobileDetail(p,lead){
  if(!isMobileUX()||!p)return;
  const d=document.getElementById('mobileDetail');
  if(!d)return;
  d.innerHTML='<button class="md-close" type="button" aria-label="關閉">✕</button>'+(lead?`<div class="sub" style="font-size:12px;color:var(--muted);margin:2px 34px 6px 0">${lead}</div>`:'')+popupHtml(p);
  d.querySelector('.md-close').onclick=hideMobileDetail;
  d.hidden=false;
  setMobileMode('map');
}
function attachMobileMarker(mk,p,lead){
  mk.on('click',()=>{if(isMobileUX()){setTimeout(()=>map.closePopup(),0);showMobileDetail(p,lead);}});
  return mk;
}
function syncMobileDayBar(day){
  const bar=document.getElementById('mobileDayBar'); if(!bar)return;
  if(state.region!=='__trip'){bar.innerHTML='';syncMobileHud();return;}
  bar.innerHTML=TRIP.map(dd=>`<span class="chip${dd.d===day.d?' on':''}" data-d="${dd.d}">D${dd.d} ${dd.date}</span>`).join('');
  bar.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{state.tripDay=Number(c.dataset.d);state.tripPlan='A';renderTrip();});
  syncMobileHud();
}
function initMobileControls(){
  const by=id=>document.getElementById(id);
  if(by('mobileModeMap'))by('mobileModeMap').onclick=()=>setMobileMode('map');
  if(by('mobileModeFilter'))by('mobileModeFilter').onclick=()=>setMobileMode('filter');
  if(by('mobileModeList'))by('mobileModeList').onclick=()=>setMobileMode('list');

function _distKm(a,b){const dx=(a.lat-b.lat)*111,dy=(a.lng-b.lng)*93;return Math.sqrt(dx*dx+dy*dy);}
function nearbyOf(p,n,maxKm){
  n=n||4;maxKm=maxKm||0.6;
  if(!p||!p.lat)return[];
  return PLACES.filter(q=>q.lat&&q.city===p.city&&q.name!==p.name&&!['交通','住宿'].includes(q.category))
    .map(q=>[_distKm(p,q),q]).filter(x=>x[0]<=maxKm).sort((a,b)=>a[0]-b[0]).slice(0,n);
}
function nearbyText(p){
  return nearbyOf(p).map(x=>{

  }).join("、");
}
function nearbyEats(p){
  if(!p||!p.lat)return"";

    .map(q=>({q,d:_distKm(p,q)})).filter(x=>x.d<=0.6).sort((a,b)=>a.d-b.d).slice(0,4)
    .map(x=>`${x.q.name} ${Math.max(50,Math.round(x.d*1000/50)*50)}m`).join("、");
}
function autoAltName(stop){
  const p=findPlace(stop.name);if(!p||!p.lat)return null;
  const cand=PLACES.filter(q=>q.lat&&q.city===p.city&&FOOD_CATS.has(q.category)&&q.name!==p.name)
    .map(q=>({q,d:_distKm(p,q)})).filter(x=>x.d<=2).sort((a,b)=>a.d-b.d);
  return cand.length?cand[0].q.name:null;
}
function altHTML(stop){
  let names=Array.isArray(stop.alt)?stop.alt.slice():(stop.alt?[stop.alt]:[]);
  let auto=false;
  if(!names.length){const a=autoAltName(stop);if(a){names=[a];auto=true;}}
  if(!names.length)return"";
  const main=findPlace(stop.name);
  const items=names.map(nm=>{
    const q=findPlace(nm);if(!q)return null;
    const d=(main&&main.lat&&q.lat)?_distKm(main,q):null;
    const dist=d!=null?` ${Math.max(50,Math.round(d*1000/50)*50)}m`:'';
    const place=encodeURIComponent(q.name.trim());
    return `<a href="map.html?q=${place}" data-focus-place="${place}" style="color:#a04b12">${q.name}</a>${dist}`;
  }).filter(Boolean);

const NEARBY_CATS=new Set(["景點","祭典","動漫","溫泉","購物","住宿"]);

function gmapLink(p){

function passesBase(p){
  if(!citiesOf(state.region).includes(p.city))return false;
  if(!state.cats.has(p.category))return false;
  if(FOOD_CATS.has(p.category)&&!state.cuisineGroups.has(CUISINE2GROUP[p.cuisine]||cuisineGroup(p.cuisine)))return false;
  return true;
}
function matchesSearch(p){
  if(!state.q)return true;
  const q=j2t(state.q.toLowerCase());
  const hay=j2t([p.name,p.name_zh,p.name_ja,p.area,p.address,p.cuisine,p.reason,p.halal===true?'清真 ハラール halal':(p.halal||''),p.tabelog?'食べログ '+p.tabelog:'',...(p.dishes||[]),...(p.activities||[])].join(" ").toLowerCase());
  return hay.includes(q);
}
function passes(p){return passesBase(p)&&matchesSearch(p);}

function highlightMarker(pid,on){
  const mk=markers.find(m=>m._pid===pid);
  if(!mk||!mk._icon)return;
  mk._icon.classList.toggle('pin-hl',on);
  mk.setZIndexOffset(on?1300:(mk._z||0));
}
function sortByCenter(items){
  const c=map.getCenter();
  return items.slice().sort((a,b)=>{
    const da=(a.lat&&a.lng)?c.distanceTo([a.lat,a.lng]):Infinity;
    const db=(b.lat&&b.lng)?c.distanceTo([b.lat,b.lng]):Infinity;
    return da-db;
  });
}
function buildList(items){

      <div class="meta">${p.area||""}${p.cuisine?"｜"+p.cuisine:""}${p.hours?"｜"+p.hours:""}${p.price?"｜"+p.price:""}${p.ticket?"｜門票 "+p.ticket:""}</div>
      ${(p.dishes||p.activities)?`<div class="dishes">${(p.dishes||p.activities).slice(0,4).join("、")}</div>`:""}`;

// ---------- 📅 行程模式 ----------
function _normFull(s){return j2t((s||"").replace(/[·・\s]/g,"").toLowerCase());}
function _norm(s){return j2t((s||"").replace(/[（(].*?[)）]/g,"").replace(/[·・\s]/g,"").toLowerCase());}
const _PIDX=PLACES.map(p=>[_norm(p.name),_normFull(p.name),p]);
function findPlace(name){
  const full=_normFull(name),n=_norm(name);if(!n)return null;
  const exact=_PIDX.find(([,pfull])=>pfull===full);if(exact)return exact[2];
  let best=null,bestLen=0;
  for(const [pn,,p] of _PIDX){
    if(pn===n)return p;
    if((pn.includes(n)||n.includes(pn))&&pn.length>bestLen){best=p;bestLen=pn.length;}
  }
  return best;
}
function focusTripPlace(name){
  const p=findPlace(name);
  if(!p||!p.lat||!p.lng)return;
  focusOn([p.lat,p.lng],16);
  let mk=markers.find(m=>m._pid===p._id);
  if(!mk){
    mk=L.marker([p.lat,p.lng],{icon:makeIcon(p.category,false,p),zIndexOffset:1200})
      .addTo(map).bindPopup(popupHtml(p),{maxWidth:Math.min(300,window.innerWidth-90)});
    attachMobileMarker(mk,p);
    mk._pid=p._id;markers.push(mk);
  }
  if(isMobileUX())showMobileDetail(p);else mk.openPopup();
}
document.getElementById('list').addEventListener('click',e=>{
  const link=e.target.closest('a[data-focus-place]');
  if(!link)return;

const KIND_COLOR={spot:"#1b4f8a",meal:"#e67e22",hotel:"#37474f",move:"#5d4037"};

    iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-30]});
}
function renderTrip(keepView){

  document.getElementById('tripSummary').innerHTML=`<h2>D${day.d}｜${day.date}（${day.wd}） ${day.city}</h2><p>${day.title}</p><div class="summary-badges"><span>${activeStops.length} 站</span>${moveCount?`<span>${moveCount} 個交通節點</span>`:''}${hotelStop?`<span>🏨 ${hotelStop.name}</span>`:''}${day.variants?`<span>方案 ${state.tripPlan}</span>`:''}</div>`;

  let bgCount=0;
  if(state.tripShowAll){
    const stopNames=new Set(activeStops.map(s=>_norm(s.name)));
    const q=j2t(state.q.toLowerCase());
    // 當日城市 ＋ 同區域其他城市都疊上來（例如 2/2 選熊本案時也能看到熊本）
    const dayCities=new Set([day.city]);
    activeStops.forEach(s=>{const p=findPlace(s.name);if(p)dayCities.add(p.city);});
    PLACES.forEach(p=>{
      if(!p.lat||!dayCities.has(p.city))return;
      if(!state.cats.has(p.category))return;
      if(FOOD_CATS.has(p.category)&&!state.cuisineGroups.has(CUISINE2GROUP[p.cuisine]||cuisineGroup(p.cuisine)))return;
      if(stopNames.has(_norm(p.name)))return;
      let searchMatch=true;
      if(q){const hay=j2t([p.name,p.name_zh,p.name_ja,p.area,p.cuisine,...(p.dishes||[]),...(p.activities||[])].join(" ").toLowerCase());searchMatch=hay.includes(q);}
      const cfg=iconFor(p.category,p);
      const mk=L.marker([p.lat,p.lng],{icon:L.divIcon({className:'pin-wrap',
        html:`<div class="pin" style="background:${cfg.color};transform:rotate(-45deg) scale(.72);opacity:${searchMatch?'.62':'.16'}"><span>${cfg.emoji}</span></div>`,
        iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-26]}),zIndexOffset:0})
        .addTo(map).bindPopup(popupHtml(p),{maxWidth:Math.min(300,window.innerWidth-90)});
      attachMobileMarker(mk,p);
      mk._pid=p._id;markers.push(mk);bgCount++;
    });
  }
  const bgHint=state.tripShowAll?(bgCount>0?`（＋背景 ${bgCount} 個地點）`:`（背景 0 個——受上方篩選影響，按「全選」可顯示全部類型）`):"";
  const planHint=day.variants?`・方案 ${state.tripPlan}`:"";
  document.getElementById('count').textContent=`📅 ${day.date}（${day.wd}）${planHint} ｜ ${activeStops.length} 站${bgHint}`;

  const pts=[];
  activeStops.forEach((s,i)=>{
    const p=findPlace(s.name);
    if(p&&p.lat&&p.lng){
      pts.push([p.lat,p.lng]);
      const lead=`${s.t}｜${s.label||''}`;
      const mk=L.marker([p.lat,p.lng],{icon:numIcon(i+1,s.kind),zIndexOffset:1000+i})
        .addTo(map)
        .bindPopup(`<div class="pp"><div class="sub" style="margin-bottom:4px">${lead}</div>`+popupHtml(p).replace('<div class="pp">','')+`</div>`,{maxWidth:Math.min(300,window.innerWidth-90)});
      attachMobileMarker(mk,p,lead);
      mk._stopIdx=i;markers.push(mk);
    }
    const card=document.createElement('div');card.className='card trip-card'+(i===0?' first':'')+(i===activeStops.length-1?' last':'');
    const isPlaceStop=(s.kind==='spot'||s.kind==='hotel');
    const nb=(p&&isPlaceStop)?nearbyText(p):"";
    const eats=(p&&isPlaceStop)?nearbyEats(p):"";
    const plain=(s.note||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
    const brief=plain.length>105?plain.slice(0,105).replace(/[，、；][^，、；]*$/,'')+'…':plain;
    const alt=(s.kind==='meal'||s.alt)?altHTML(s):'';
    card.innerHTML=`<div class="top"><span class="badge" style="background:${KIND_COLOR[s.kind]||'#555'}">${i+1}</span><span class="trip-time">${s.t}</span><div style="min-width:0;flex:1"><h3>${s.name}</h3><div class="trip-label">${s.label||""}${p&&!p.lat?'｜⚠️ 無座標，地圖上不顯示':''}</div></div></div>
      ${brief?`<div class="trip-brief">${brief}</div>`:""}
      <div class="mobile-trip-full">${s.note||''}</div>
      ${(s.note||alt||eats||nb)?`<details class="trip-details"><summary>查看詳細資料</summary><div class="trip-full">${s.note||''}${alt?`<div class="meta" style="margin-top:6px;color:#a04b12">${alt}</div>`:''}${eats?`<div class="meta" style="margin-top:6px;color:#0e7c6b">🍽 附近吃的：${eats}</div>`:''}${nb?`<div class="meta" style="margin-top:6px">🧭 附近：${nb}</div>`:''}</div></details>`:''}
      ${(s.go&&i<activeStops.length-1)?`<div class="trip-leg">↓ ${s.go}</div>`:""}`;
    card.onclick=()=>{
      const mk=markers.find(m=>m._stopIdx===i);
      if(mk){focusOn(mk.getLatLng(),16);
        if(isMobileUX()&&p)showMobileDetail(p,`${s.t}｜${s.label||''}`);else mk.openPopup();
        setMobileMode('map');}
    };
    const details=card.querySelector('details');
    if(details)details.onclick=function(e){e.stopPropagation();};
    list.appendChild(card);
  });
  if(pts.length>1){
    routeLine=L.polyline(pts,{color:'#1b4f8a',weight:3,opacity:.75,dashArray:'8 6'}).addTo(map);
    if(!keepView)map.fitBounds(routeLine.getBounds(),fitPad());
  }else if(pts.length===1&&!keepView){focusOn(pts[0],13);}
  syncMobileDayBar(day);
  syncMobileHud();
  syncDesktopNav();
}

// ---------- 📡 定位 ----------
// 日本境內用 WGS-84，瀏覽器回傳的座標直接用，不需要任何偏移轉換。
(function(){
  let watchId=null,meMarker=null,meCircle=null,firstFix=true;
  const LocCtl=L.Control.extend({
    options:{position:'topleft'},
    onAdd(){
      const d=L.DomUtil.create('div','loc-btn');
      d.id='locBtn';d.title='顯示目前位置';d.textContent='🎯';
      L.DomEvent.disableClickPropagation(d);
      d.onclick=toggleLocate;
      return d;
    }
  });
  map.addControl(new LocCtl());
  function setBtn(s){document.getElementById('locBtn').className='loc-btn'+(s?' '+s:'');}
  function onPos(pos){
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const acc=Math.min(pos.coords.accuracy||50,500);
    if(!meMarker){
      meMarker=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:2000,interactive:false}).addTo(map);
      meCircle=L.circle([lat,lng],{radius:acc,color:'#1976d2',weight:1,fillColor:'#1976d2',fillOpacity:.12,interactive:false}).addTo(map);
    }else{
      meMarker.setLatLng([lat,lng]);
      meCircle.setLatLng([lat,lng]).setRadius(acc);
    }
    if(firstFix){firstFix=false;focusOn([lat,lng],16);}
    setBtn('active');
  }
  function onErr(e){
    stopLocate();setBtn('err');
    const msg=e.code===1?'定位權限被拒絕——請在瀏覽器設定允許本網站取得位置':
             (e.code===2?'目前無法取得位置（GPS 訊號弱或未開啟）':'定位逾時，請再試一次');
    alert('📡 '+msg);
    setTimeout(()=>setBtn(''),1500);
  }
  function stopLocate(){
    if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
    if(meMarker){map.removeLayer(meMarker);meMarker=null;}
    if(meCircle){map.removeLayer(meCircle);meCircle=null;}
    firstFix=true;setBtn('');
  }
  function toggleLocate(){
    if(watchId!==null){stopLocate();return;}
    if(!navigator.geolocation){alert('此瀏覽器不支援定位');return;}
    setBtn('active');
    watchId=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
  }
})();

<script>
/* 離線：註冊 Service Worker ＋ 一鍵預載目前地圖範圍的國土地理院圖磚 */
(function(){
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(){
        if(!('caches' in window))return;
        caches.open('fukuoka-app-v116').then(function(c){var __pages=['./','itinerary.html','map.html','prep.html','config.js'];__pages.forEach(function(u){c.match(u).then(function(hit){if(!hit)c.add(u).catch(function(){});});});
          document.querySelectorAll('script[src],link[href]').forEach(function(el){
            var u=el.src||el.href; if(!u||u.indexOf(location.origin)!==0)return;
            c.match(u).then(function(hit){ if(!hit) c.add(u).catch(function(){}); });
          });
        });
      }).catch(function(){});
    });
  }
  var btn=document.getElementById('offlineBtn');
  if(!btn)return;
  if(!('caches' in window)){ btn.disabled=true; btn.textContent='離線預載需用 https 網址開啟'; return; }
  function lon2tile(lon,z){return Math.floor((lon+180)/360*Math.pow(2,z));}
  function lat2tile(lat,z){var r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z));}
  function tileUrl(x,y,z){return 'https://cyberjapandata.gsi.go.jp/xyz/pale/'+z+'/'+x+'/'+y+'.png';}
  var busy=false, orig=btn.textContent;
  btn.dataset.origText=orig;
  btn.onclick=async function(){
    if(busy)return;
    if(window.__googleBaseActive){ alert('Google 圖磚依服務條款不可離線快取。請先在右上角切回「國土地理院」或「OpenStreetMap」再預載。'); return; }
    var b=map.getBounds(), z0=Math.max(11,Math.round(map.getZoom())), zMax=Math.min(16,z0+2);
    var urls=[];
    for(var z=z0; z<=zMax; z++){
      var xa=lon2tile(b.getWest(),z), xb=lon2tile(b.getEast(),z);
      var ya=lat2tile(b.getNorth(),z), yb=lat2tile(b.getSouth(),z);
      for(var x=Math.min(xa,xb); x<=Math.max(xa,xb); x++)
        for(var y=Math.min(ya,yb); y<=Math.max(ya,yb); y++)
          urls.push(tileUrl(x,y,z));
    }
    if(!urls.length)return;
    if(urls.length>3000){ alert('此範圍圖磚太多（約 '+urls.length+' 張），請先放大地圖縮小範圍再預載。'); return; }
    busy=true; btn.disabled=true;
    var total=urls.length, done=0, fail=0, i=0;
    var cache=await caches.open('fukuoka-tiles-v1');
    async function worker(){
      while(i<urls.length){
        var u=urls[i++];
        try{ var res=await fetch(u,{mode:'no-cors'}); await cache.put(u,res); }
        catch(e){ fail++; }
        done++;
        if(done%15===0||done===total) btn.textContent='預載中… '+done+'/'+total;
      }
    }
    await Promise.all([worker(),worker(),worker(),worker(),worker(),worker()]);
    btn.textContent='✅ 已預載 '+(total-fail)+'/'+total+' 張'+(fail?'（'+fail+' 張失敗）':'');
    setTimeout(function(){ btn.textContent=orig; btn.disabled=false; busy=false; },5000);
  };
})();
</script>
